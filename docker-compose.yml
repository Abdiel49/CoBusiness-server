services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cobusiness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cobusiness-local}
      POSTGRES_DB: ${DB_NAME:-cobusiness}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cobusiness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cobusiness} -d ${DB_NAME:-cobusiness}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cobusiness-postgres:
