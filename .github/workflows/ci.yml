name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cobusiness
          POSTGRES_PASSWORD: cobusiness
          POSTGRES_DB: cobusiness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cobusiness -d cobusiness_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: cobusiness
      DB_PASSWORD: cobusiness
      DB_NAME: cobusiness_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run migration:run
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run migration:show
